{% extends "base.html" %}{% block title %}Login · Smart Shop{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card shadow">
    <div class="text-center mb-4"><div class="brand-icon">🛍</div><h2 class="fw-bold mt-3">Smart Shop</h2><p class="text-secondary">Inventory, billing & sales in one place</p></div>
    <form method="post">
      <label class="form-label">Username</label><input class="form-control form-control-lg mb-3" name="username" required autofocus>
      <label class="form-label">Password</label><input class="form-control form-control-lg mb-4" type="password" name="password" required>
      <button class="btn btn-primary btn-lg w-100">Sign in</button>
    </form>
    <!-- <div class="demo-note mt-4"><b>Demo login</b><br>Username: admin<br>Password: admin123</div> -->
  </div>
</div>
{% endblock %}
