{% extends "base.html" %}{% block title %}Edit Product · Smart Shop{% endblock %}
{% block content %}
<div class="mb-4"><p class="eyebrow mb-1">INVENTORY</p><h2 class="page-title">Edit product</h2></div>
<div class="panel form-panel"><form method="post" class="p-4">
 <label class="form-label">Product name *</label><input class="form-control mb-3" name="name" value="{{ product.name }}" required>
 <div class="row"><div class="col-md-6"><label class="form-label">SKU</label><input class="form-control mb-3" name="sku" value="{{ product.sku or '' }}"></div><div class="col-md-6"><label class="form-label">Category</label><input class="form-control mb-3" name="category" value="{{ product.category or '' }}"></div></div>
 <label class="form-label">Supplier</label><select class="form-select mb-3" name="supplier_id"><option value="">No supplier</option>{% for s in suppliers %}<option value="{{ s.id }}" {% if product.supplier_id==s.id %}selected{% endif %}>{{ s.name }}</option>{% endfor %}</select>
 <div class="row"><div class="col-md-6"><label class="form-label">Purchase price (₹)</label><input class="form-control mb-3" name="purchase_price" type="number" min="0" step=".01" value="{{ product.purchase_price }}" required></div><div class="col-md-6"><label class="form-label">Selling price (₹)</label><input class="form-control mb-3" name="selling_price" type="number" min="0" step=".01" value="{{ product.selling_price }}" required></div></div>
 <div class="row"><div class="col-md-6"><label class="form-label">Stock quantity</label><input class="form-control mb-3" name="quantity" type="number" min="0" value="{{ product.quantity }}" required></div><div class="col-md-6"><label class="form-label">Low-stock alert level</label><input class="form-control mb-3" name="min_quantity" type="number" min="0" value="{{ product.min_quantity }}" required></div></div>
 <button class="btn btn-primary">Save changes</button> <a class="btn btn-light" href="{{ url_for('products') }}">Cancel</a>
</form></div>
{% endblock %}
